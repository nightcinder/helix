name: security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    permissions:
      # `security-events` is for the code scanning upload on the public repo.
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Install semgrep
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/semgrep-venv/bin/pip" install --quiet semgrep
      - name: Scan
        # `--error` fails the job on findings; the SARIF steps below still run (`if: always()`).
        run: |
          "$RUNNER_TEMP/semgrep-venv/bin/semgrep" scan \
            --error \
            --config p/security-audit \
            --config p/secrets \
            --sarif \
            --output semgrep.sarif
      - name: Upload Semgrep SARIF artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: warn
          retention-days: 30
      # Code scanning keeps state across runs and dedupes fixed findings. It needs GitHub Advanced
      # Security on a private repo, so only the public mirror (nightcinder/helix) publishes there.
      - name: Publish to code scanning
        if: always() && !github.event.repository.private
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # Dependency CVEs for the resolved Gradle dependency tree, transitive ones included. OSV carries
  # advisories the GitHub Advisory Database does not always mirror, so this is not a duplicate
  # of Dependabot. A finding fails the job and blocks the merge, like gitleaks and semgrep.
  osv-scanner:
    name: osv-scanner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      # osv-scanner cannot read build.gradle.kts or the version catalog, only lockfiles. The repo
      # keeps no lockfiles (Dependabot owns versions), so this run writes a throwaway
      # gradle.lockfile with an init script that turns on locking. Only releaseRuntimeClasspath is
      # resolved, so the lockfile holds exactly what ships in the APK; AGP, lint and the test
      # runner (which pull in netty, protobuf, guava and an older Bouncy Castle) never ship and are
      # kept current through Dependabot instead.
      - name: Resolve the shipped dependencies into a lockfile
        run: |
          cat > "$RUNNER_TEMP/lock-all.init.gradle" <<'EOF'
          allprojects {
              dependencyLocking { lockAllConfigurations() }
          }
          EOF
          chmod +x gradlew
          ./gradlew --no-daemon -I "$RUNNER_TEMP/lock-all.init.gradle" \
            :app:dependencies --configuration releaseRuntimeClasspath --write-locks > /dev/null
          find . -name '*gradle.lockfile' -not -path './.gradle/*'
          # The lockfiles are gitignored, hence --no-ignore on the scan below.
      - name: Install osv-scanner
        run: |
          curl -sSfL -o "$RUNNER_TEMP/osv-scanner_linux_amd64" \
            https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64
          curl -sSfL -o "$RUNNER_TEMP/osv-scanner_SHA256SUMS" \
            https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_SHA256SUMS
          (cd "$RUNNER_TEMP" && grep ' osv-scanner_linux_amd64$' osv-scanner_SHA256SUMS | sha256sum -c -)
          chmod +x "$RUNNER_TEMP/osv-scanner_linux_amd64"
      - name: Scan dependencies
        run: |
          "$RUNNER_TEMP/osv-scanner_linux_amd64" scan source -r --no-ignore . \
            --format sarif \
            --output-file osv.sarif
      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: osv-sarif
          path: osv.sarif
          if-no-files-found: warn
          retention-days: 30
      - name: Publish to code scanning
        if: always() && !github.event.repository.private
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: osv.sarif
          category: osv-scanner